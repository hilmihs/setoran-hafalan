trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: Maahir-Prod # Gunakan prefix ENV_

pool:
  vmImage: ubuntu-latest

steps:
  - task: Bash@3
    displayName: "🔧 Generate exportable ENV from Variable Group"
    inputs:
      targetType: "inline"
      script: |
        # Emit systemd EnvironmentFile format (KEY=value, NO `export`, one per line).
        # systemd EnvironmentFile does not accept shell syntax; double-quoted values
        # are unquoted by systemd and `$` is left literal (safe for tokens).
        echo "🔄 Export Azure DevOps Variable Group (prefix ENV_) to systemd env file"
        printenv | grep '^ENV_' | while IFS='=' read -r key value; do
          safe_value=$(python3 -c "import json, os; print(json.dumps(os.getenv('$key')))")
          echo "$key=$safe_value"
        done > maahir.env

        cat maahir.env
  #⬇️ Kirim maahir.env ke server via SCP
  - task: CopyFilesOverSSH@0
    displayName: "📤 Upload maahir.env to server"
    inputs:
      sshEndpoint: "server-staging@103.181.142.223"
      sourceFolder: "."
      contents: "maahir.env"
      targetFolder: "/var/www/html/maahir"
      cleanTargetFolder: false
      overwrite: true
  - task: Ssh@0
    displayName: "🔗 Wire maahir.env into next-maahir via systemd drop-in"
    inputs:
      sshEndpoint: "server-staging@103.181.142.223"
      runOptions: "inline"
      failOnStdErr: false
      inline: |
        # env_vars.sh dulu di-upload tapi tak pernah dibaca proses → semua var
        # (ENV_PUBLIC_API dll) tak sampai ke `next start` → /api/v1/* 404.
        # Pasang EnvironmentFile lewat drop-in (idempotent, tak perlu sentuh unit).
        DROPIN_DIR=/etc/systemd/system/next-maahir.service.d
        DESIRED='[Service]
        EnvironmentFile=/var/www/html/maahir/maahir.env'
        sudo mkdir -p "$DROPIN_DIR"
        if [ "$(cat "$DROPIN_DIR/10-env.conf" 2>/dev/null)" != "$DESIRED" ]; then
          echo "$DESIRED" | sudo tee "$DROPIN_DIR/10-env.conf"
          sudo systemctl daemon-reload
          echo "✅ EnvironmentFile drop-in installed"
        else
          echo "✅ drop-in already current, skip"
        fi
  - task: Ssh@0
    displayName: "🔧 Ensure nginx upload limit (audio rekaman ~14MB)"
    inputs:
      sshEndpoint: "server-staging@103.181.142.223"
      runOptions: "inline"
      failOnStdErr: false
      inline: |
        NGINX_SNIPPET="/etc/nginx/conf.d/maahir-upload-limit.conf"
        if [ ! -f "$NGINX_SNIPPET" ]; then
          echo "client_max_body_size 64m;" | sudo tee "$NGINX_SNIPPET"
          sudo nginx -t && sudo systemctl reload nginx
          echo "✅ nginx client_max_body_size 64m set"
        else
          echo "✅ nginx upload limit sudah ada, skip"
        fi
  - task: Ssh@0
    displayName: "📁 Ensure audio storage dir writable (filesystem migration)"
    inputs:
      sshEndpoint: "server-staging@103.181.142.223"
      runOptions: "inline"
      failOnStdErr: false
      inline: |
        # Storage audio pindah Supabase→filesystem. Service next-maahir jalan root,
        # jadi cukup pastikan folder ada (writeFile root ke dir root = OK).
        sudo mkdir -p /var/www/html/maahir/storage/setoran-audio
        # Service next-maahir jalan sbg user NON-root (probe /api/health kasih EACCES),
        # jadi 0775 root:root tak cukup. 0777 supaya user service bisa tulis audio.
        # Dir ini di balik auth app (/api/audio HMAC), bukan diekspos langsung.
        sudo chmod -R 0777 /var/www/html/maahir/storage
        echo "✅ storage dir:"; ls -ld /var/www/html/maahir/storage /var/www/html/maahir/storage/setoran-audio
        df -h /var/www/html/maahir/storage | tail -1
  - task: Ssh@0
    displayName: "🚀 Deploy Next.js Frontend"
    inputs:
      sshEndpoint: "server-staging@103.181.142.223"
      runOptions: "inline"
      failOnStdErr: false
      inline: |
        echo "🚀 START: Deploy Next.js Frontend"
        set -euo pipefail 2>/dev/null || set -eu

        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

        cd /var/www/html/maahir
        echo "📂 Current folder: $(pwd)"

        echo "⬇️ Git sync Web Maahir (strict)"
        git fetch origin main
        git reset --hard origin/main
        echo "📌 Deployed commit: $(git log -1 --oneline)"

        echo "📦 Install dependency Web Maahir"
        nvm exec 24.15.0 npm install

        # Service jalan sebagai root dan terus menulis cache runtime ke
        # .next/standalone/.next selama ia hidup. Kalau build jalan bersamaan,
        # Next gagal menimpa direktori root-owned itu:
        #   EACCES: permission denied, rmdir '.next/standalone/.next'
        # Karena versi lama sudah terhapus, kegagalan itu meninggalkan server
        # tanpa berkas — aset 500, situs tak terpakai.
        #
        # Maka: hentikan service dulu supaya tak ada penulis lain, JANGAN hapus
        # .next (cukup ambil alih kepemilikannya). Build yang gagal kini
        # menyisakan build lama utuh, dan trap menghidupkannya kembali.
        echo "⏸️ Stop service selama build (hindari race root vs user)"
        sudo systemctl stop next-maahir

        # Build gagal → hidupkan lagi versi lama yang masih di disk.
        rollback() {
          echo "⚠️ Build gagal — menghidupkan kembali build sebelumnya"
          sudo systemctl start next-maahir || true
          sudo systemctl status next-maahir --no-pager || true
        }
        trap rollback ERR

        echo "🔑 Ambil alih kepemilikan .next (cache runtime bisa root-owned)"
        sudo mkdir -p .next
        sudo chown -R "$(id -u):$(id -g)" .next

        echo "⚙️ Build Web Maahir"
        nvm exec 24.15.0 npm run build

        echo "📁 Copy static files to standalone folder"
        cp -r .next/static .next/standalone/.next/

        trap - ERR

        echo "▶️ Start systemd service"
        sudo systemctl start next-maahir
        sudo systemctl status next-maahir --no-pager

        echo "✅ Next.js frontend deployment selesai"